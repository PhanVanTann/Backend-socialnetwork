# ============================================================
# render.yaml — Infrastructure as Code cho Render
#
# Docs: https://render.com/docs/blueprint-spec
# Commit file này vào git → Render tự sync infrastructure.
# ============================================================
services:
  # ──────────────────────────────────────
  # Web Service — AI Agent
  # ──────────────────────────────────────
  - type: web
    name: ai-agent
    runtime: python
    
    region: singapore         # Chọn region gần user nhất
    plan: free                # free | starter | standard | pro
    buildCommand: pip install -r app/requirements.txt
    startCommand: daphne -b 0.0.0.0 -p 8000 myapp.asgi:application
    healthCheckPath: /health   # Render check path này
    autoDeploy: true           # Auto deploy khi push to GitHub
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.11.0
      # Secrets — set qua Render Dashboard (không commit giá trị thật)
      - key: MOGO_URL
        sync: false           
      - key: MOGO_DB_NAME
        sync: false 
      - key: GOOGLE_CLIENT_SECRET
        sync: false 
      - key: BREVO_API_KEY
        sync: false 
      - key: GOOGLE_CLIENT_ID
        sync: false 
      - key: SECRET_KEY
        sync: false 
      - key: API_KEY
        sync: false 
      - key: API_SECRET
        sync: false 
      - key: CLOUD_NAME
        sync: false 
      - key: REDIS_URL
        sync: false 
    # Disk (nếu agent cần lưu file)
    # disk:
    #   name: agent-data
    #   mountPath: /data
    #   sizeGB: 1

  # ──────────────────────────────────────
  # Redis (dùng Render Redis add-on)
  # ──────────────────────────────────────
  - type: redis
    name: agent-cache
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList:              # Required by Render Blueprint spec
      - source: 0.0.0.0/0    # Allow all IPs — restrict this in production
        description: everywhere

# ============================================================
# Cách deploy:
#   1. Push code lên GitHub
#   2. Render Dashboard → New → Blueprint
#   3. Connect repo → Render đọc render.yaml này
#   4. Review và Deploy
# ============================================================